<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Areum Golden Hour Window</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

    <main class="window-widget">

        <div class="window-frame">

            <!-- 창틀 안쪽 홈 -->
            <div class="inner-frame">

                <!-- 실제 창밖 풍경 -->
                <div class="glass-view">

                    <img
                        src="golden-hour-school.png"
                        alt="노을진 방과후 학교 풍경"
                        class="outside-view"
                    >

                    <div
                        class="muntin muntin-vertical"
                        aria-hidden="true"
                    ></div>

                    <div
                        class="muntin muntin-horizontal"
                        aria-hidden="true"
                    ></div>

                    <!-- 유리 위 골든아워 틴트 -->
                    <div
                        class="sunset-glow"
                        aria-hidden="true"
                    ></div>

                    <!-- 교실 내부가 비친 듯한 반사 -->
                    <div
                        class="glass-reflection"
                        aria-hidden="true"
                    ></div>

                    <!-- 아주 희미한 유리 얼룩 -->
                    <div
                        class="glass-texture"
                        aria-hidden="true"
                    ></div>

                </div>

            </div>


            <!-- 아래쪽 샷시 턱 -->
            <div
                class="window-sill"
                aria-hidden="true"
            ></div>


            <!-- 프레임 위 빛 -->
            <div
                class="frame-highlight"
                aria-hidden="true"
            ></div>

        </div>

    </main>

</body>

</html>
