<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>After School Ambience</title>

<style>
:root {
    --bg: #191919;
    --text: #e8dfd2;
    --sub: #9f9488;
    --accent: #b9855c;
}

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

.player {
    width: min(92vw, 540px);
    padding: 24px 28px;
}

.title {
    font-size: 20px;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
}

.subtitle {
    font-size: 12px;
    color: var(--sub);
    letter-spacing: 0.12em;
    margin-bottom: 22px;
}

.controls {
    display: flex;
    align-items: center;
    gap: 18px;
}

.play-btn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1px solid #574b42;
    background: #211e1c;
    color: var(--text);
    font-size: 18px;
    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;
}

.play-btn:hover {
    background: #292420;
}

.volume-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 12px;
}

.volume-label {
    color: var(--sub);
    font-size: 12px;
}

input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
}

.status {
    margin-top: 18px;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: #766c64;
}
</style>
</head>

<body>

<div class="player">

    <div class="title">AFTER SCHOOL AMBIENCE</div>
    <div class="subtitle">quiet classroom · golden hour</div>

    <div class="controls">

        <button id="playBtn" class="play-btn">
            ▶
        </button>

        <div class="volume-wrap">

            <span class="volume-label">VOL</span>

            <input
                id="volume"
                type="range"
                min="0"
                max="100"
                value="55"
            >

        </div>

    </div>

    <div id="status" class="status">
        room is quiet
    </div>

</div>


<audio id="ambience" src="ambience.mp3" loop preload="auto"></audio>
<audio id="birds" src="birds.wav" preload="auto"></audio>
<audio id="basketball" src="basketball.wav" preload="auto"></audio>
<audio id="door" src="door.wav" preload="auto"></audio>


<script>

const ambience = document.getElementById("ambience");
const birds = document.getElementById("birds");
const basketball = document.getElementById("basketball");
const door = document.getElementById("door");

const playBtn = document.getElementById("playBtn");
const volumeSlider = document.getElementById("volume");
const statusText = document.getElementById("status");

let playing = false;
let eventTimer = null;


/* -------------------------
   볼륨
-------------------------- */

let masterVolume = 0.55;

function updateVolume() {

    masterVolume = volumeSlider.value / 100;

    ambience.volume = masterVolume * 0.55;

    birds.volume = masterVolume * 0.16;

    basketball.volume = masterVolume * 0.11;

    door.volume = masterVolume * 0.10;
}

volumeSlider.addEventListener("input", updateVolume);

updateVolume();


/* -------------------------
   Play / Pause
-------------------------- */

playBtn.addEventListener("click", async () => {

    if (!playing) {

        try {

            await ambience.play();

            playing = true;

            playBtn.textContent = "❚❚";

            statusText.textContent = "after school";

            scheduleNextEvent();

        } catch (err) {

            console.error(err);

        }

    } else {

        ambience.pause();

        birds.pause();
        basketball.pause();
        door.pause();

        birds.currentTime = 0;
        basketball.currentTime = 0;
        door.currentTime = 0;

        playing = false;

        playBtn.textContent = "▶";

        statusText.textContent = "room is quiet";

        clearTimeout(eventTimer);

    }

});


/* -------------------------
   랜덤 이벤트 선택
-------------------------- */

function chooseEvent() {

    const roll = Math.random();

    /*
        새        55%
        농구공    30%
        문        15%
    */

    if (roll < 0.55) {

        return {
            audio: birds,
            name: "birds outside"
        };

    }

    if (roll < 0.85) {

        return {
            audio: basketball,
            name: "distant playground"
        };

    }

    return {
        audio: door,
        name: "next classroom"
    };

}


/* -------------------------
   이벤트 재생
-------------------------- */

function playRandomEvent() {

    if (!playing) return;

    const event = chooseEvent();

    event.audio.currentTime = 0;

    event.audio.play().catch(() => {});

    statusText.textContent = event.name;

    event.audio.onended = () => {

        statusText.textContent = "after school";

        scheduleNextEvent();

    };

}


/* -------------------------
   다음 이벤트 시간
-------------------------- */

function scheduleNextEvent() {

    if (!playing) return;

    clearTimeout(eventTimer);

    /*
        45초 ~ 120초 사이 랜덤
    */

    const min = 45 * 1000;
    const max = 120 * 1000;

    const delay =
        min +
        Math.random() * (max - min);

    eventTimer =
        setTimeout(
            playRandomEvent,
            delay
        );

}

</script>

</body>
</html>
