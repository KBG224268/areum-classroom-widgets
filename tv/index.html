<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Areum Classroom TV</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="tv">

        <div class="tv-frame">

            <div class="screen">

                <div class="scanlines"></div>
                <div class="glass-light"></div>

                <div class="screen-header">
                    <span>AFTER SCHOOL</span>
                    <span id="current-time">17:42</span>
                </div>

                <div class="message-area">
                    <div class="message-icon" id="message-icon">●</div>

                    <div class="message" id="message">
                        방과후 교실이 조용해졌습니다.
                    </div>
                </div>

                <div class="screen-footer">
                    AREUM SCHOOL BROADCAST
                </div>

            </div>

            <div class="tv-brand">Areum</div>

            <div class="power-light"></div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
