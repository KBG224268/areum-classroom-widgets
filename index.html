<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Areum Classroom Clock</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="clock">

    <div class="metal-ring">

        <div class="face">

            <!-- 눈금 -->
            <div class="minute-ticks"></div>
            <div class="hour-ticks"></div>

            <!-- 숫자 -->
            <div class="number n12">12</div>
            <div class="number n1">1</div>
            <div class="number n2">2</div>
            <div class="number n3">3</div>
            <div class="number n4">4</div>
            <div class="number n5">5</div>
            <div class="number n6">6</div>
            <div class="number n7">7</div>
            <div class="number n8">8</div>
            <div class="number n9">9</div>
            <div class="number n10">10</div>
            <div class="number n11">11</div>

            <!-- 브랜드 -->
            <div class="brand">
                <div class="brand-name">Areum</div>
                <div class="brand-sub">CLASSROOM CLOCK</div>
            </div>

            <!-- 바늘 -->
            <div class="hand hour-hand"></div>
            <div class="hand minute-hand"></div>

            <div class="second-hand">
                <div class="second-tail"></div>
            </div>

            <div class="center-pin"></div>

            <!-- 유리 반사 -->
            <div class="glass-shade"></div>

            <div class="light-reflection light-one"></div>
            <div class="light-reflection light-two"></div>

            <div class="sunset-reflection"></div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
